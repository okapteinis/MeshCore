[d1l_common]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.partitions = default_8MB.csv

build_flags =
  -D BOARD_HAS_PSRAM=0
  -D CONFIG_SPIRAM_SUPPORT=0
  -D LOVYANGFX_USE_PSRAM=0
  -D ARDUINO_LOOP_STACK_SIZE=16384
  -D CONFIG_ARDUINO_EVENT_RUNNING_CORE=1
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  -D LORA_MOSI=48
  -D LORA_MISO=47
  -D LORA_SCK=41
  -D TCA9535_I2C_ADDR=0x20
  -D TCA9535_I2C_FREQ=400000
  -D IO_EXPANDER_IRQ=42
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4
  -D SX126X_CURRENT_LIMIT=140
  ; -D DISPLAY_CLASS=SCIndicatorDisplay  ; DISABLED - headless repeater mode
  ; -D DISPLAY_LINES=21                  ; DISABLED
  ; -D LINE_LENGTH=53                    ; DISABLED
  ; -D UI_ZOOM=3.5                       ; DISABLED
  -D PIN_USER_BTN=38
  -D HAS_TOUCH
  -D USE_CUSTOM_RADIOLIB_HAL=1
  -D RADIOLIB_GODMODE=1
   -D RADIO_DRIVER_AVAILABLE=1

build_src_filter =
  +<../variants/sensecap_indicator_d1l/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors/*>
  +<helpers/radiolib/*.cpp>

lib_deps =
  lovyan03/LovyanGFX @ ^1.2.7
  adafruit/Adafruit BusIO @ ^1.17.2
  https://github.com/RobTillaart/TCA9555.git#d27147d8b21e5ae3e37da5f512855377398bb6c1

[env:SenseCapIndicator-D1L_companion]
extends = esp32_base
board = ${d1l_common.board}
board_build.arduino.memory_type = ${d1l_common.board_build.arduino.memory_type}
board_build.flash_mode = ${d1l_common.board_build.flash_mode}
board_upload.flash_size = ${d1l_common.board_upload.flash_size}
board_upload.maximum_size = ${d1l_common.board_upload.maximum_size}
board_build.partitions = ${d1l_common.board_build.partitions}

build_flags =
  ${esp32_base.build_flags}
  ${d1l_common.build_flags}
  -I src
  -I variants/sensecap_indicator_d1l
  -I variants/sensecap_indicator_d1l/hal
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D SPIFFS_AUTO_FORMAT=1

build_src_filter =
  ${esp32_base.build_src_filter}
  ${d1l_common.build_src_filter}
  +<../examples/companion_radio/ui-new/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../variants/sensecap_indicator_d1l/hal/*.cpp>

lib_deps =
  ${esp32_base.lib_deps}
  ${d1l_common.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:SenseCapIndicator-D1L_repeater]
extends = esp32_base
board = ${d1l_common.board}
board_build.arduino.memory_type = ${d1l_common.board_build.arduino.memory_type}
board_build.flash_mode = ${d1l_common.board_build.flash_mode}
board_upload.flash_size = ${d1l_common.board_upload.flash_size}
board_upload.maximum_size = ${d1l_common.board_upload.maximum_size}
board_build.partitions = ${d1l_common.board_build.partitions}

build_flags =
  ${esp32_base.build_flags}
  ${d1l_common.build_flags}
  -I src
  -I variants/sensecap_indicator_d1l
  -I variants/sensecap_indicator_d1l/hal
  -I examples/simple_repeater
  -D ADVERT_NAME='"SenseCAP Indicator D1L"'
  -D ADVERT_LAT=56.950266
  -D ADVERT_LON=24.132886
  -D FIRMWARE_BUILD_DATE=\"${PIOENV}\"
  -D FIRMWARE_VERSION=\"1.0.0-D1L\"
  -D LORA_TX_POWER=22
  -D RADIO_DRIVER_AVAILABLE=1
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D MAX_NEIGHBOURS=50
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CORE_DEBUG_LEVEL=4
  -D BLE_PIN_CODE=123456
  -D BLE_NAME_PREFIX=\"MeshCore-\"
  -D ADMIN_PASSWORD='"PLACEHOLDER_CHANGE_BEFORE_FLASH"'
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1

build_src_filter =
  ${esp32_base.build_src_filter}
  ${d1l_common.build_src_filter}
  +<../examples/simple_repeater>
  -<../examples/companion_radio/*>
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<../variants/sensecap_indicator_d1l/hal/*.cpp>

lib_deps =
  ${esp32_base.lib_deps}
  ${d1l_common.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

