[SenseCapIndicator-D1L]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/sensecap_indicator_d1l
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  ; SPI Bus Pins (Direct GPIO)
  -D LORA_MOSI=48
  -D LORA_MISO=47
  -D LORA_SCK=41
  ; IO Expander Configuration (must be defined before pin definitions)
  -D IO_EXPANDER=0x40
  ; SX1262 Control Pins (IO Expander)
  ; Note: These pins require IO expander support
  ; Pattern: (pin | IO_EXPANDER) where IO_EXPANDER is the I2C address
  -D LORA_CS=(0|IO_EXPANDER)
  -D LORA_RST=(1|IO_EXPANDER)
  -D LORA_BUSY=(2|IO_EXPANDER)
  -D LORA_DIO1=(3|IO_EXPANDER)
  -D IO_EXPANDER_IRQ=42
  ; Radio Configuration
  -D LORA_FREQ=869.525
  -D LORA_BW=250
  -D LORA_SF=11
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4
  -D SX126X_CURRENT_LIMIT=140
  ; Display Configuration
  -D DISPLAY_CLASS=SCIndicatorDisplay
  -D DISPLAY_LINES=21
  -D LINE_LENGTH=53
  -D UI_ZOOM=3.5
  ; Other Pins
  -D PIN_USER_BTN=38
  -D HAS_TOUCH
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sensecap_indicator_d1l/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors/*>
  +<helpers/radiolib/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
  adafruit/Adafruit BusIO @ ^1.17.2

[env:SenseCapIndicator-D1L_comp_radio_usb]
extends = SenseCapIndicator-D1L
build_flags =
  ${SenseCapIndicator-D1L.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${SenseCapIndicator-D1L.build_src_filter}
  +<../examples/companion_radio/ui-new/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${SenseCapIndicator-D1L.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ===== SENSECAP INDICATOR D1L WITH CUSTOM HAL =====
; This environment uses custom RadioLib HAL for TCA9535 I/O expander
; Enables full LoRa functionality via SX1262 radio
;
; Hardware: SenseCAP Indicator D1L with LoRa
; Radio: SX1262 (control pins via TCA9535 I2C expander at 0x20)
; HAL: Custom implementation in variants/sensecap_indicator_d1l/hal/

[env:SenseCapIndicator-D1L_HAL_comp_radio_usb]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default.csv
build_flags =
  ${esp32_base.build_flags}
  -I src
  -I variants/sensecap_indicator_d1l
  -I examples/companion_radio/ui-new
  -I variants/sensecap_indicator_d1l/hal
  -D PIN_BOARD_SDA=39
  -D PIN_BOARD_SCL=40
  ; SPI Bus Pins (Direct GPIO)
  -D LORA_MOSI=48
  -D LORA_MISO=47
  -D LORA_SCK=41
  ; Radio Configuration
  -D LORA_FREQ=869.525
  -D LORA_BW=250
  -D LORA_SF=11
  -D LORA_TX_POWER=20
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4
  -D SX126X_CURRENT_LIMIT=140
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D IO_EXPANDER=0x40
  ; Display Configuration
  -D DISPLAY_CLASS=SCIndicatorDisplay
  -D DISPLAY_LINES=21
  -D LINE_LENGTH=53
  -D UI_ZOOM=3.5
  ; Other Pins
  -D PIN_USER_BTN=38
  -D HAS_TOUCH
  ; App Configuration
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  ; Enable custom RadioLib HAL
  -D USE_CUSTOM_RADIOLIB_HAL=1
  -D RADIOLIB_GODMODE=1
  ; TCA9535 I2C configuration
  -D TCA9535_I2C_SDA=6
  -D TCA9535_I2C_SCL=7
  -D TCA9535_I2C_ADDR=0x20
  -D TCA9535_I2C_FREQ=400000
  ; LoRa SPI configuration (direct to ESP32-S3)
  -D LORA_SPI_SCK=9
  -D LORA_SPI_MISO=10
  -D LORA_SPI_MOSI=11
  ; LoRa control pins (virtual via TCA9535)
  -D LORA_NSS=100
  -D LORA_RESET=101
  -D LORA_BUSY=102
  -D LORA_DIO1=103
  ; Pin name compatibility aliases
  -D LORA_CS=LORA_NSS
  -D LORA_RST=LORA_RESET
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/sensecap_indicator_d1l/*.cpp>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors/*>
  +<helpers/radiolib/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
  adafruit/Adafruit BusIO @ ^1.17.2
  densaugeo/base64 @ ~1.4.0
  https://github.com/RobTillaart/TCA9555.git#d27147d8b21e5ae3e37da5f512855377398bb6c1

